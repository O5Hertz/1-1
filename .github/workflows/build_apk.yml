name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 延长超时时间，首次构建可能需要30-50分钟
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置Python环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: 安装系统依赖
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq git unzip openjdk-17-jdk zlib1g-dev autoconf libtool
        
    - name: 安装Buildozer
      run: pip install buildozer cython==0.29.35
        
    - name: 配置Android SDK环境
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg  # 避免下载失败
        buildozer android init
        
    - name: 构建APK (Debug)
      run: |
        buildozer -v android debug
        ls -lh bin/*.apk
        
    - name: 上传APK
      uses: actions/upload-artifact@v4
      with:
        name: LocationImpressionsApp-APK
        path: bin/*.apk
